---
# cPanel Git Version Control → "Deploy HEAD Commit" runs these tasks.
# Pull/update alone only changes ~/repositories/... — NOT public_html.
deployment:
  tasks:
    - export DEPLOYPATH=/home/aessasin/public_html/track.aessas.in/
    - export REPOPATH=$(pwd)
    - /usr/bin/rsync -a --delete --exclude '.git' --exclude '.github' ./ "$DEPLOYPATH"
    - cd "$DEPLOYPATH" && /usr/local/bin/composer install --no-dev --no-interaction --optimize-autoloader